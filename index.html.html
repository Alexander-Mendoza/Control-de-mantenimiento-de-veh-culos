<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Flota Vehicular</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
:root{--primary:#1e40af;--primary-dark:#1e3a8a;--accent:#2563eb;--success:#16a34a;--warning:#ea580c;--danger:#dc2626;--caution:#ca8a04;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--radius:10px;--shadow:0 2px 8px rgba(0,0,0,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
button{cursor:pointer;font-family:inherit;border:none;border-radius:var(--radius);padding:10px 16px;font-weight:600;transition:all .2s}
input,select,textarea{font-family:inherit;padding:10px;border:1px solid var(--border);border-radius:var(--radius);width:100%;font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
label{display:block;font-weight:600;margin-bottom:4px;font-size:13px;color:var(--muted)}
.form-group{margin-bottom:14px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{opacity:.9}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:.9}
.btn-warning{background:var(--warning);color:#fff}.btn-warning:hover{opacity:.9}
.btn-secondary{background:#e2e8f0;color:var(--text)}.btn-secondary:hover{background:#cbd5e1}
.btn-sm{padding:6px 10px;font-size:12px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a8a,#2563eb);padding:20px}
.login-box{background:#fff;padding:40px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:420px}
.login-box h1{text-align:center;color:var(--primary);margin-bottom:8px;font-size:26px}
.login-box p{text-align:center;color:var(--muted);margin-bottom:24px;font-size:14px}
.login-box button{width:100%;margin-top:10px;padding:12px}
.login-error{background:#fee2e2;color:var(--danger);padding:10px;border-radius:8px;margin-bottom:14px;font-size:13px;display:none}
.login-help{text-align:center;margin-top:16px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:14px}
.login-help a{color:var(--accent);text-decoration:none;font-weight:600}
.app{display:none;min-height:100vh}
.topbar{background:var(--primary);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow);position:sticky;top:0;z-index:50}
.topbar h2{font-size:18px;display:flex;align-items:center;gap:8px}
.user-info{display:flex;align-items:center;gap:12px;font-size:14px}
.user-info .email{opacity:.9;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge-admin{background:#fbbf24;color:#78350f}
.badge-user{background:#93c5fd;color:#1e3a8a}
.layout{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:240px;background:#fff;border-right:1px solid var(--border);padding:16px 0;flex-shrink:0}
.sidebar button{display:block;width:100%;text-align:left;background:transparent;color:var(--text);padding:12px 20px;border-radius:0;font-weight:500;font-size:14px;border-left:3px solid transparent}
.sidebar button:hover{background:#f1f5f9}
.sidebar button.active{background:#eff6ff;color:var(--primary);border-left-color:var(--primary);font-weight:700}
.sidebar .section-title{padding:16px 20px 6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.main{flex:1;padding:24px;overflow-x:auto}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.page-header h1{font-size:24px}
.page-header p{color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
.card h3{margin-bottom:14px;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat{background:#fff;padding:18px;border-radius:var(--radius);box-shadow:var(--shadow);border-left:4px solid var(--accent)}
.stat.green{border-left-color:var(--success)}
.stat.orange{border-left-color:var(--warning)}
.stat.red{border-left-color:var(--danger)}
.stat.yellow{border-left-color:var(--caution)}
.stat .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat .value{font-size:28px;font-weight:700;margin-top:6px}
.table-wrap{overflow-x:auto;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#f8fafc;padding:12px;text-align:left;font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border)}
td{padding:12px;border-bottom:1px solid var(--border)}
tr:hover{background:#f8fafc}
tr.row-red{background:#fef2f2}
tr.row-orange{background:#fff7ed}
.status-pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase}
.status-green{background:#dcfce7;color:#166534}
.status-orange{background:#ffedd5;color:#9a3412}
.status-red{background:#fee2e2;color:#991b1b}
.status-yellow{background:#fef9c3;color:#854d0e}
.actions-cell{display:flex;gap:6px;flex-wrap:wrap}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{margin-bottom:16px;color:var(--primary);font-size:20px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.search-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-bar input{max-width:300px}
@media(max-width:768px){.layout{flex-direction:column}.sidebar{width:100%;padding:8px 0;border-right:none;border-bottom:1px solid var(--border);display:flex;overflow-x:auto;gap:4px}.sidebar .section-title{display:none}.sidebar button{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;padding:10px 14px;font-size:13px}.sidebar button.active{border-left-color:transparent;border-bottom-color:var(--primary)}.main{padding:16px}.topbar h2{font-size:15px}.user-info .email{max-width:120px}}
.empty{text-align:center;padding:40px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:10px;opacity:.4}
.history-item{background:#f8fafc;padding:12px;border-radius:8px;margin-bottom:8px;border-left:3px solid var(--accent);font-size:13px}
.history-item strong{color:var(--primary)}
.history-item .date{color:var(--muted);font-size:11px;display:block;margin-top:4px}
.audit-row{font-size:13px}
.audit-row .old{background:#fee2e2;padding:2px 6px;border-radius:4px;color:#991b1b}
.audit-row .new{background:#dcfce7;padding:2px 6px;border-radius:4px;color:#166534}
.alert-banner{background:#fef3c7;border-left:4px solid var(--caution);padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:14px}
.alert-banner.danger{background:#fee2e2;border-color:var(--danger)}
.alert-banner.success{background:#dcfce7;border-color:var(--success);color:#166534}
.alert-banner.info{background:#dbeafe;border-color:var(--accent);color:#1e40af}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.two-col{grid-template-columns:1fr}}
.temp-pass-box{background:#eff6ff;border:2px dashed var(--accent);padding:14px;border-radius:8px;margin:14px 0;text-align:center}
.temp-pass-box .pass{font-family:'Courier New',monospace;font-size:22px;font-weight:700;color:var(--primary);letter-spacing:2px;margin:8px 0;padding:8px;background:#fff;border-radius:6px;display:inline-block;min-width:120px}
.temp-pass-box small{color:var(--muted);display:block;margin-top:6px}
.profile-card{display:flex;align-items:center;gap:16px;padding:16px;background:#f8fafc;border-radius:10px;margin-bottom:16px}
.profile-avatar{width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex-shrink:0}
.profile-info h3{margin:0 0 4px 0;font-size:16px}
.profile-info p{margin:0;color:var(--muted);font-size:13px}
.loading{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin 1s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loginScreen" class="login-wrap">
  <div class="login-box">
    <h1>🚗 Control de Flota</h1>
    <p>Sistema de mantenimiento vehicular</p>
    <div id="loginError" class="login-error"></div>
    <div class="form-group"><label>Correo electrónico</label><input type="email" id="loginEmail" placeholder="tucorreo@ejemplo.com"></div>
    <div class="form-group"><label>Contraseña</label><input type="password" id="loginPass"></div>
    <button class="btn-primary" onclick="doLogin()" id="loginBtn">Iniciar sesión</button>
    <div class="login-help">¿Olvidaste tu contraseña?<br><a href="#" onclick="requestPasswordRecovery();return false;">Solicitar recuperación al administrador</a></div>
    <div style="text-align:center;margin-top:15px;border-top:1px solid var(--border);padding-top:15px"><p style="font-size:13px;color:var(--muted);margin-bottom:8px">¿No tienes cuenta?</p><button class="btn-success" style="width:100%" onclick="showRegisterModal()">📝 Crear cuenta nueva</button></div>
  </div>
</div>
<div id="app" class="app">
  <div class="topbar"><h2>🚗 Control de Flota Vehicular</h2><div class="user-info"><span class="email" id="currentUserName"></span><span id="currentUserBadge" class="badge"></span><button class="btn-secondary btn-sm" onclick="doLogout()">Cerrar sesión</button></div></div>
  <div class="layout"><div class="sidebar" id="sidebar"></div><div class="main" id="main"></div></div>
</div>
<div id="modal" class="modal-overlay"><div class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="modal-actions" id="modalActions"></div></div></div>
<script>
var SUPABASE_URL = 'https://hosvpvbwkbhvrzwtooeb.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_y6QoG2t5I52S9bN7IUoKJg_D2GolFfH';
var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var EMAILJS_CONFIG = {publicKey: 'XHIQMYfjte-Z6L3Jj', serviceId: '7yaw0kj', templateId: 'qrmfu7o'};
if(typeof emailjs !== 'undefined'){ emailjs.init(EMAILJS_CONFIG.publicKey); }
var currentUser = null, allUsers = [], allVehicles = [], allMileage = [], allMaintenance = [], allTires = [], allAudit = [], appSettings = {};
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function today(){ return new Date().toISOString().slice(0,10); }
function now(){ return new Date().toISOString(); }
function fmtDate(d){ if(!d) return '-'; return new Date(d).toLocaleDateString('es-MX',{year:'numeric',month:'short',day:'numeric'}); }
function fmtDateTime(d){ if(!d) return '-'; return new Date(d).toLocaleString('es-MX'); }
function fmtNum(n){ return (n||0).toLocaleString('es-MX'); }
function unit(v){ return v==='mi'?'mi':'km'; }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function isValidEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e||'')); }
function generateTempPassword(len=10){ var chars='ABCDEFGHJKMNPQRSTUVWXYZ23456789', p=''; for(var i=0;i<len;i++) p+=chars.charAt(Math.floor(Math.random()*chars.length)); return p; }
function showModal(title, bodyHtml, actions){ document.getElementById('modalTitle').textContent = title; document.getElementById('modalBody').innerHTML = bodyHtml; var act = document.getElementById('modalActions'); act.innerHTML = ''; actions.forEach(function(a){ var b = document.createElement('button'); b.textContent = a.label; b.className = a.class || 'btn-secondary'; b.onclick = function(){ if(a.onClick()!==false) closeModal(); }; act.appendChild(b); }); document.getElementById('modal').classList.add('show'); }
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').addEventListener('click', function(e){ if(e.target.id==='modal') closeModal(); });
function isAdmin(){ return currentUser && currentUser.role==='admin'; }
function canEdit(){ return isAdmin(); }
async function audit(action, entity, entityId, field, oldValue, newValue){ try{ await supabase.from('audit_log').insert([{user_email: currentUser.email, action: action, entity: entity, entity_id: entityId, field: field, old_value: oldValue==null?'':String(oldValue), new_value: newValue==null?'':String(newValue)}]); }catch(e){ console.error('Audit error:', e); } }
async function loadData(){ try{ var r1 = await supabase.from('users').select('*'); var r2 = await supabase.from('vehicles').select('*'); var r3 = await supabase.from('mileage_history').select('*'); var r4 = await supabase.from('maintenance_history').select('*'); var r5 = await supabase.from('tire_history').select('*'); var r6 = await supabase.from('audit_log').select('*'); var r7 = await supabase.from('settings').select('*').eq('id', 1).single(); allUsers = r1.data || []; allVehicles = r2.data || []; allMileage = r3.data || []; allMaintenance = r4.data || []; allTires = r5.data || []; allAudit = r6.data || []; appSettings = r7.data || {maintenance_km:5000,maintenance_mi:3000,alert_km:200,alert_mi:150,tire_km:33000,tire_mi:20000,tire_alert_km:30000,tire_alert_mi:18000}; }catch(e){ console.error('Error loading data:', e); } }
function sendPasswordEmail(userEmail, userName, tempPassword){ if(!EMAILJS_CONFIG.publicKey){ return Promise.resolve(false); } return emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, {to_email: userEmail, user_name: userName, temp_password: tempPassword}).then(function(){return true;}).catch(function(){return false;}); }
async function doLogin(){ var email = document.getElementById('loginEmail').value.trim().toLowerCase(); var pass = document.getElementById('loginPass').value; var err = document.getElementById('loginError'); var btn = document.getElementById('loginBtn'); if(!email || !pass){ err.textContent='Ingresa tu correo y contraseña'; err.style.display='block'; return; } btn.innerHTML = 'Cargando...'; btn.disabled = true; err.style.display='none'; await loadData(); var user = allUsers.find(function(x){ return x.email.toLowerCase()===email && x.password===pass; }); if(!user){ err.textContent='Correo o contraseña incorrectos'; err.style.display='block'; btn.innerHTML='Iniciar sesión'; btn.disabled=false; return; } if(!user.enabled){ err.textContent='Esta cuenta está deshabilitada. Contacta al administrador.'; err.style.display='block'; btn.innerHTML='Iniciar sesión'; btn.disabled=false; return; } currentUser = user; document.getElementById('loginScreen').style.display='none'; document.getElementById('app').style.display='block'; document.getElementById('currentUserName').textContent = user.email; var badge = document.getElementById('currentUserBadge'); badge.textContent = user.role==='admin'?'Administrador':'Operativo'; badge.className = 'badge '+(user.role==='admin'?'badge-admin':'badge-user'); renderSidebar(); navigate('dashboard'); btn.innerHTML='Iniciar sesión'; btn.disabled=false; }
function doLogout(){ currentUser = null; document.getElementById('app').style.display='none'; document.getElementById('loginScreen').style.display='flex'; document.getElementById('loginEmail').value=''; document.getElementById('loginPass').value=''; document.getElementById('loginError').style.display='none'; }
document.getElementById('loginPass').addEventListener('keypress',function(e){ if(e.key==='Enter') doLogin(); });
function requestPasswordRecovery(){ showModal('Recuperar contraseña', '<p>La recuperación debe ser gestionada por el <strong>administrador</strong>.</p><div class="alert-banner info" style="margin-top:14px"><strong>¿Qué debes hacer?</strong><ol style="margin-top:8px;padding-left:20px;line-height:1.8"><li>Contacta al administrador.</li><li>El administrador generará una contraseña desde <strong>👥 Usuarios</strong>.</li><li>Recibirás la contraseña en tu <strong>correo</strong>.</li><li>Cámbiala desde <strong>👤 Mi perfil</strong>.</li></ol></div>', [{label:'Entendido', class:'btn-primary', onClick:function(){return true;}}]); }
function showRegisterModal(){ var body = '<p style="margin-bottom:15px;color:var(--muted);font-size:14px;">Crea tu cuenta. <strong>Nota:</strong> Quedará "Pendiente" hasta que el administrador la habilite.</p><div class="form-group"><label>Nombre completo *</label><input type="text" id="reg_name"></div><div class="form-group"><label>Correo electrónico *</label><input type="email" id="reg_email"></div><div class="form-group"><label>Contraseña * (mínimo 6 caracteres)</label><input type="password" id="reg_pass"></div><div id="reg_msg"></div>'; showModal('Crear nueva cuenta', body, [{label:'Cancelar', class:'btn-secondary', onClick:function(){return true;}}, {label:'Registrarme', class:'btn-success', onClick:async function(){ var name = document.getElementById('reg_name').value.trim(); var email = document.getElementById('reg_email').value.trim().toLowerCase(); var pass = document.getElementById('reg_pass').value; var msg = document.getElementById('reg_msg'); if(!name || !email || !pass){ msg.innerHTML = '<div class="alert-banner danger">Completa todos los campos.</div>'; return false; } if(!isValidEmail(email)){ msg.innerHTML = '<div class="alert-banner danger">Correo inválido.</div>'; return false; } if(pass.length < 6){ msg.innerHTML = '<div class="alert-banner danger">Mínimo 6 caracteres.</div>'; return false; } if(allUsers.some(function(u){ return u.email.toLowerCase() === email; })){ msg.innerHTML = '<div class="alert-banner danger">Este correo ya está registrado.</div>'; return false; } var r = await supabase.from('users').insert([{email: email, password: pass, name: name, role: 'user', enabled: false}]); if(r.error){ msg.innerHTML = '<div class="alert-banner danger">Error: '+r.error.message+'</div>'; return false; } msg.innerHTML = '<div class="alert-banner success">✅ Cuenta creada. Espera a que el administrador la habilite.</div>'; await loadData(); return false; }}]); }
var pages = [{id:'dashboard', label:'📊 Panel principal', roles:['admin','user']},{id:'vehicles', label:'🚙 Vehículos', roles:['admin','user']},{id:'mileage', label:'📏 Kilometraje', roles:['admin','user']},{id:'maintenance', label:'🔧 Mantenimientos', roles:['admin','user']},{id:'tires', label:'🛞 Llantas', roles:['admin','user']},{id:'history', label:'📜 Historial', roles:['admin','user']},{id:'profile', label:'👤 Mi perfil', roles:['admin','user']},{id:'users', label:'👥 Usuarios', roles:['admin']},{id:'settings', label:'⚙️ Configuración', roles:['admin']},{id:'audit', label:'🔍 Auditoría', roles:['admin']},{id:'export', label:'📤 Exportar', roles:['admin','user']}];
function renderSidebar(){ var sb = document.getElementById('sidebar'); sb.innerHTML = '<div class="section-title">Menú</div>'; pages.filter(function(p){ return p.roles.includes(currentUser.role); }).forEach(function(p){ var b = document.createElement('button'); b.textContent = p.label; b.dataset.page = p.id; b.onclick = function(){ navigate(p.id); }; sb.appendChild(b); }); }
function navigate(id){ document.querySelectorAll('.sidebar button').forEach(function(b){ b.classList.toggle('active', b.dataset.page===id); }); var renderers = {dashboard:renderDashboard, vehicles:renderVehicles, mileage:renderMileage, maintenance:renderMaintenance, tires:renderTires, history:renderHistory, profile:renderProfile, users:renderUsers, settings:renderSettings, audit:renderAudit, export:renderExport}; renderers[id](); }
function getVehicleStatus(v){ var mants = allMaintenance.filter(function(m){ return m.vehicle_id===v.id; }).sort(function(a,b){ return b.mileage-a.mileage; }); var lastMant = mants[0]; var baseMileage = lastMant ? lastMant.mileage : 0; var interval = v.maintenance_interval || (v.unit==='mi' ? appSettings.maintenance_mi : appSettings.maintenance_km); var alertThreshold = v.unit==='mi' ? appSettings.alert_mi : appSettings.alert_km; var nextMant = baseMileage + interval; var remaining = nextMant - v.current_mileage; var maintStatus='green', maintLabel='OK'; if(remaining <= 0){ maintStatus='red'; maintLabel='Vencido'; } else if(remaining <= alertThreshold){ maintStatus='orange'; maintLabel='Próximo'; } var tires = allTires.filter(function(t){ return t.vehicle_id===v.id; }).sort(function(a,b){ return b.mileage-a.mileage; }); var lastTire = tires[0]; var tireBase = lastTire ? lastTire.mileage : 0; var tireLimit = v.unit==='mi' ? appSettings.tire_mi : appSettings.tire_km; var tireAlert = v.unit==='mi' ? appSettings.tire_alert_mi : appSettings.tire_alert_km; var tireRemaining = tireLimit - (v.current_mileage - tireBase); var tireStatus='green', tireLabel='OK'; if(!lastTire){ tireStatus='yellow'; tireLabel='Sin registro'; } else if(tireRemaining <= 0){ tireStatus='red'; tireLabel='Vencido'; } else if(tireRemaining <= (tireLimit - tireAlert)){ tireStatus='yellow'; tireLabel='Próximo'; } return {maintStatus: maintStatus, maintLabel: maintLabel, remaining: remaining, nextMant: nextMant, interval: interval, tireStatus: tireStatus, tireLabel: tireLabel, tireRemaining: tireRemaining, tireLimit: tireLimit, tireDriven: v.current_mileage - tireBase}; }
function renderDashboard(){ var main = document.getElementById('main'); var statuses = allVehicles.map(function(v){ return Object.assign({}, v, {st: getVehicleStatus(v)}); }); var total = allVehicles.length; var maintOk = statuses.filter(function(s){ return s.st.maintStatus==='green'; }).length; var maintSoon = statuses.filter(function(s){ return s.st.maintStatus==='orange'; }).length; var maintOverdue = statuses.filter(function(s){ return s.st.maintStatus==='red'; }).length; var tireOk = statuses.filter(function(s){ return s.st.tireStatus==='green'; }).length; var tireSoon = statuses.filter(function(s){ return s.st.tireStatus==='yellow'; }).length; var tireOverdue = statuses.filter(function(s){ return s.st.tireStatus==='red'; }).length; main.innerHTML = '<div class="page-header"><div><h1>Panel principal</h1><p>Resumen general de la flota</p></div></div><div class="stats"><div class="stat"><div class="label">Total vehículos</div><div class="value">'+total+'</div></div><div class="stat green"><div class="label">Mantenimiento OK</div><div class="value">'+maintOk+'</div></div><div class="stat orange"><div class="label">Mantenimiento próximo</div><div class="value">'+maintSoon+'</div></div><div class="stat red"><div class="label">Mantenimiento vencido</div><div class="value">'+maintOverdue+'</div></div><div class="stat green"><div class="label">Llantas OK</div><div class="value">'+tireOk+'</div></div><div class="stat yellow"><div class="label">Llantas próximas</div><div class="value">'+tireSoon+'</div></div><div class="stat red"><div class="label">Llantas vencidas</div><div class="value">'+tireOverdue+'</div></div></div><div class="card"><h3>Estado general de la flota</h3><div class="search-bar"><input type="text" id="dashSearch" placeholder="🔍 Buscar..." oninput="filterDashTable()"></div><div class="table-wrap"><table><thead><tr><th>Equipo</th><th>Vehículo</th><th>Km/Mi</th><th>Próx. mant.</th><th>Estado mant.</th><th>Estado llantas</th><th>Acciones</th></tr></thead><tbody id="dashBody"></tbody></table></div></div>'; filterDashTable(); }
function filterDashTable(){ var q = (document.getElementById('dashSearch')?.value||'').toLowerCase(); var tbody = document.getElementById('dashBody'); if(!tbody) return; var rows = allVehicles.filter(function(v){ return !q || String(v.equipment_number).toLowerCase().includes(q) || (v.brand||'').toLowerCase().includes(q); }).map(function(v){ var st = getVehicleStatus(v); var u = unit(v.unit); var rowClass = st.maintStatus==='red'?'row-red':st.maintStatus==='orange'?'row-orange':''; return '<tr class="'+rowClass+'"><td><strong>'+escapeHtml(v.equipment_number)+'</strong></td><td>'+escapeHtml(v.brand)+' '+escapeHtml(v.model)+'</td><td>'+fmtNum(v.current_mileage)+' '+u+'</td><td>'+fmtNum(st.nextMant)+' '+u+'</td><td><span class="status-pill status-'+st.maintStatus+'">'+st.maintLabel+'</span></td><td><span class="status-pill status-'+st.tireStatus+'">'+st.tireLabel+'</span></td><td class="actions-cell"><button class="btn-secondary btn-sm" onclick="viewVehicle(\''+v.id+'\')">Ver</button></td></tr>'; }).join(''); tbody.innerHTML = rows || '<tr><td colspan="7" class="empty"><div class="empty-icon">🚙</div>No hay vehículos.</td></tr>'; }
function viewVehicle(id){ var v = allVehicles.find(function(x){ return x.id===id; }); var st = getVehicleStatus(v); var u = unit(v.unit); var mants = allMaintenance.filter(function(m){ return m.vehicle_id===id; }); var tires = allTires.filter(function(t){ return t.vehicle_id===id; }); var miles = allMileage.filter(function(m){ return m.vehicle_id===id; }); var body = '<div class="stats" style="margin-bottom:16px"><div class="stat"><div class="label">Equipo</div><div class="value" style="font-size:18px">'+escapeHtml(v.equipment_number)+'</div></div><div class="stat '+st.maintStatus+'"><div class="label">Mantenimiento</div><div class="value" style="font-size:18px"><span class="status-pill status-'+st.maintStatus+'">'+st.maintLabel+'</span></div></div><div class="stat '+st.tireStatus+'"><div class="label">Llantas</div><div class="value" style="font-size:18px"><span class="status-pill status-'+st.tireStatus+'">'+st.tireLabel+'</span></div></div></div><p><strong>Vehículo:</strong> '+escapeHtml(v.brand)+' '+escapeHtml(v.model)+'</p><p><strong>Km actual:</strong> '+fmtNum(v.current_mileage)+' '+u+'</p><p><strong>Próx. mantenimiento:</strong> '+fmtNum(st.nextMant)+' '+u+' (faltan '+fmtNum(Math.max(0,st.remaining))+')</p>'; showModal('Detalle del vehículo', body, [{label:'Cerrar', class:'btn-secondary', onClick:function(){return true;}}]); }
function renderVehicles(){ var main = document.getElementById('main'); main.innerHTML = '<div class="page-header"><div><h1>Vehículos</h1><p>'+allVehicles.length+' vehículos</p></div><button class="btn-primary" onclick="openVehicleForm()">+ Agregar</button></div><div class="card"><div class="search-bar"><input type="text" id="vehSearch" placeholder="🔍 Buscar..." oninput="renderVehicleList()"></div><div id="vehicleList"></div></div>'; renderVehicleList(); }
function renderVehicleList(){ var q = (document.getElementById('vehSearch')?.value||'').toLowerCase(); var list = document.getElementById('vehicleList'); var filtered = allVehicles.filter(function(v){ return !q || String(v.equipment_number).toLowerCase().includes(q); }); if(!filtered.length){ list.innerHTML = '<div class="empty"><div class="empty-icon">🚙</div>Sin vehículos.</div>'; return; } list.innerHTML = '<div class="table-wrap"><table><thead><tr><th>Equipo</th><th>Marca</th><th>Modelo</th><th>Año</th><th>Km/Mi</th><th>Acciones</th></tr></thead><tbody>'+filtered.map(function(v){ var u = unit(v.unit); return '<tr><td><strong>'+escapeHtml(v.equipment_number)+'</strong></td><td>'+escapeHtml(v.brand)+'</td><td>'+escapeHtml(v.model)+'</td><td>'+escapeHtml(v.year||'-')+'</td><td>'+fmtNum(v.current_mileage)+' '+u+'</td><td class="actions-cell"><button class="btn-secondary btn-sm" onclick="viewVehicle(\''+v.id+'\')">Ver</button>'+(canEdit()?'<button class="btn-warning btn-sm" onclick="openVehicleForm(\''+v.id+'\')">Editar</button><button class="btn-danger btn-sm" onclick="deleteVehicle(\''+v.id+'\')">Eliminar</button>':'')+'</td></tr>'; }).join('')+'</tbody></table></div>'; }
function openVehicleForm(id){ var v = id ? allVehicles.find(function(x){ return x.id===id; }) : null; var title = v?'Editar vehículo':'Nuevo vehículo'; var body = '<div class="two-col"><div class="form-group"><label>Número de equipo *</label><input id="f_eq" value="'+escapeHtml(v?.equipment_number||'')+'"></div><div class="form-group"><label>Marca *</label><input id="f_brand" value="'+escapeHtml(v?.brand||'')+'"></div><div class="form-group"><label>Modelo *</label><input id="f_model" value="'+escapeHtml(v?.model||'')+'"></div><div class="form-group"><label>Año</label><input type="number" id="f_year" value="'+(v?.year||new Date().getFullYear())+'"></div><div class="form-group"><label>Unidad *</label><select id="f_unit"><option value="km" '+(v?.unit==='km'?'selected':'')+'>Kilómetros</option><option value="mi" '+(v?.unit==='mi'?'selected':'')+'>Millas</option></select></div><div class="form-group"><label>Km/Mi actual *</label><input type="number" id="f_mileage" value="'+(v?.current_mileage||0)+'"></div><div class="form-group"><label>Intervalo mant. *</label><input type="number" id="f_interval" value="'+(v?.maintenance_interval||5000)+'"></div></div>'; showModal(title, body, [{label:'Cancelar', class:'btn-secondary', onClick:function(){return true;}}, {label: v?'Guardar':'Crear', class:'btn-primary', onClick:function(){return saveVehicle(id);}}]); }
async function saveVehicle(id){ var data = {equipment_number: document.getElementById('f_eq').value.trim(), brand: document.getElementById('f_brand').value.trim(), model: document.getElementById('f_model').value.trim(), year: parseInt(document.getElementById('f_year').value)||null, unit: document.getElementById('f_unit').value, current_mileage: parseFloat(document.getElementById('f_mileage').value)||0, maintenance_interval: parseFloat(document.getElementById('f_interval').value)||0}; if(!data.equipment_number || !data.brand || !data.model){ alert('Completa los campos obligatorios.'); return false; } if(id){ var r = await supabase.from('vehicles').update(data).eq('id', id); if(r.error){ alert('Error: '+r.error.message); return false; } } else { data.created_by = currentUser.email; var r = await supabase.from('vehicles').insert([data]); if(r.error){ alert('Error: '+r.error.message); return false; } } await loadData(); renderVehicleList(); if(document.getElementById('dashBody')) filterDashTable(); return true; }
async function deleteVehicle(id){ if(!canEdit()) return; var v = allVehicles.find(function(x){ return x.id===id; }); if(!confirm('¿Eliminar '+v.equipment_number+'?')) return; var r = await supabase.from('vehicles').delete().eq('id', id); if(r.error){ alert('Error: '+r.error.message); return; } await loadData(); renderVehicleList(); }

async function saveMileage(){ var vid = document.getElementById('mileageVehicle').value; var date = document.getElementById('mileageDate').value || today(); var newM = parseFloat(document.getElementById('mileageNew').value); var notes = document.getElementById('mileageNotes').value.trim(); if(!vid){ alert('Selecciona un vehículo.'); return; } if(isNaN(newM) || newM<0){ alert('Km inválido.'); return; } var v = allVehicles.find(function(x){ return x.id===vid; }); var prev = v.current_mileage; if(newM < prev && !canEdit()){ alert('Solo el admin puede corregir.'); return; } var distance = Math.max(0, newM - prev); var r = await supabase.from('mileage_history').insert([{vehicle_id: vid, log_date: date, previous_mileage: prev, current_mileage: newM, distance: distance, notes: notes, user_email: currentUser.email}]); if(r.error){ alert('Error: '+r.error.message); return; } var r2 = await supabase.from('vehicles').update({current_mileage: newM}).eq('id', vid); await loadData(); var st = getVehicleStatus(v); var u = unit(v.unit); var alertHtml = st.maintStatus==='red' ? '<div class="alert-banner danger">⚠️ Mantenimiento vencido</div>' : st.maintStatus==='orange' ? '<div class="alert-banner">⚠️ Mantenimiento próximo. Faltan '+fmtNum(st.remaining)+' '+u+'</div>' : '<div class="alert-banner success">✅ Guardado. Distancia: '+fmtNum(distance)+' '+u+'</div>'; document.getElementById('mileageAlert').innerHTML = alertHtml; document.getElementById('mileageNew').value=''; setTimeout(function(){ renderMileage(); }, 1500); }
function renderMaintenance(){ var main = document.getElementById('main'); main.innerHTML = '<div class="page-header"><div><h1>Mantenimientos</h1></div></div><div class="card"><h3>Registrar</h3><div class="two-col"><div class="form-group"><label>Vehículo *</label><select id="mantVehicle"><option value="">-- Selecciona --</option>'+allVehicles.map(function(v){ return '<option value="'+v.id+'">'+escapeHtml(v.equipment_number)+'</option>'; }).join('')+'</select></div><div class="form-group"><label>Fecha</label><input type="date" id="mantDate" value="'+today()+'"></div><div class="form-group"><label>Km/Mi *</label><input type="number" id="mantMileage" min="0"></div><div class="form-group" style="grid-column:1/-1"><label>Observaciones</label><textarea id="mantNotes" rows="2"></textarea></div></div><button class="btn-success" onclick="saveMaintenance()">💾 Guardar</button></div><div class="card"><h3>Historial</h3><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Equipo</th><th>Km</th><th>Usuario</th></tr></thead><tbody>'+allMaintenance.sort(function(a,b){ return new Date(b.log_date)-new Date(a.log_date); }).map(function(m){ var v = allVehicles.find(function(x){ return x.id===m.vehicle_id; }); if(!v) return ''; return '<tr><td>'+fmtDate(m.log_date)+'</td><td>'+escapeHtml(v.equipment_number)+'</td><td>'+fmtNum(m.mileage)+'</td><td>'+escapeHtml(m.user_email)+'</td></tr>'; }).join('')+'</tbody></table></div></div>'; }

async function changeMyPassword(){ var current = document.getElementById('pf_current').value; var newPass = document.getElementById('pf_new').value; var confirm = document.getElementById('pf_confirm').value; var msg = document.getElementById('profileMsg'); if(!current || !newPass || !confirm){ msg.innerHTML = '<div class="alert-banner danger">Completa todos los campos.</div>'; return; } if(current !== currentUser.password){ msg.innerHTML = '<div class="alert-banner danger">Contraseña actual incorrecta.</div>'; return; } if(newPass.length < 6){ msg.innerHTML = '<div class="alert-banner danger">Mínimo 6 caracteres.</div>'; return; } if(newPass !== confirm){ msg.innerHTML = '<div class="alert-banner danger">No coinciden.</div>'; return; } var r = await supabase.from('users').update({password: newPass}).eq('id', currentUser.id); if(r.error){ msg.innerHTML = '<div class="alert-banner danger">Error: '+r.error.message+'</div>'; return; } currentUser.password = newPass; msg.innerHTML = '<div class="alert-banner success">✅ Contraseña actualizada.</div>'; document.getElementById('pf_current').value=''; document.getElementById('pf_new').value=''; document.getElementById('pf_confirm').value=''; }

async function toggleUser(id){ var u = allUsers.find(function(x){ return x.id===id; }); var r = await supabase.from('users').update({enabled: !u.enabled}).eq('id', id); if(r.error){ alert('Error: '+r.error.message); return; } await loadData(); renderUsers(); }
async function resetUserPass(id){ var u = allUsers.find(function(x){ return x.id===id; }); var tempPass = generateTempPassword(10); showModal('Generar contraseña', '<p>Contraseña temporal para:</p><div class="profile-card" style="margin:14px 0"><div class="profile-avatar">'+escapeHtml((u.name||u.email).charAt(0).toUpperCase())+'</div><div class="profile-info"><h3>'+escapeHtml(u.name)+'</h3><p>'+escapeHtml(u.email)+'</p></div></div><div class="temp-pass-box"><small>Nueva contraseña:</small><div class="pass">'+tempPass+'</div><small>Se enviará por correo.</small></div><div id="emailStatus"></div>', [{label:'Cancelar', class:'btn-secondary', onClick:function(){return true;}}, {label:'🔑 Confirmar', class:'btn-primary', onClick:async function(){ var r = await supabase.from('users').update({password: tempPass}).eq('id', id); if(r.error){ alert('Error: '+r.error.message); return false; } await loadData(); var statusDiv = document.getElementById('emailStatus'); statusDiv.innerHTML = '<div class="alert-banner info">📧 Enviando...</div>'; var sent = await sendPasswordEmail(u.email, u.name, tempPass); if(sent){ statusDiv.innerHTML = '<div class="alert-banner success">✅ Correo enviado a '+escapeHtml(u.email)+'</div>'; } else { statusDiv.innerHTML = '<div class="alert-banner danger">⚠️ No se pudo enviar. Contraseña: <strong>'+tempPass+'</strong></div>'; } setTimeout(function(){ renderUsers(); }, 3000); return false; }}]); }
function renderSettings(){ if(!isAdmin()){ document.getElementById('main').innerHTML='<div class="card"><p>Acceso restringido.</p></div>'; return; } var s = appSettings; var main = document.getElementById('main'); main.innerHTML = '<div class="page-header"><div><h1>Configuración</h1></div></div><div class="card"><h3>Mantenimiento</h3><div class="two-col"><div class="form-group"><label>Intervalo km</label><input type="number" id="s_mantKm" value="'+s.maintenance_km+'"></div><div class="form-group"><label>Intervalo mi</label><input type="number" id="s_mantMi" value="'+s.maintenance_mi+'"></div><div class="form-group"><label>Alerta km</label><input type="number" id="s_alertKm" value="'+s.alert_km+'"></div><div class="form-group"><label>Alerta mi</label><input type="number" id="s_alertMi" value="'+s.alert_mi+'"></div></div></div><div class="card"><h3>Llantas</h3><div class="two-col"><div class="form-group"><label>Límite km</label><input type="number" id="s_tireKm" value="'+s.tire_km+'"></div><div class="form-group"><label>Límite mi</label><input type="number" id="s_tireMi" value="'+s.tire_mi+'"></div><div class="form-group"><label>Alerta km</label><input type="number" id="s_tireAlertKm" value="'+s.tire_alert_km+'"></div><div class="form-group"><label>Alerta mi</label><input type="number" id="s_tireAlertMi" value="'+s.tire_alert_mi+'"></div></div><button class="btn-success" onclick="saveSettings()">💾 Guardar</button></div>'; }
async function saveSettings(){ var newSettings = {maintenance_km: parseFloat(document.getElementById('s_mantKm').value), maintenance_mi: parseFloat(document.getElementById('s_mantMi').value), alert_km: parseFloat(document.getElementById('s_alertKm').value), alert_mi: parseFloat(document.getElementById('s_alertMi').value), tire_km: parseFloat(document.getElementById('s_tireKm').value), tire_mi: parseFloat(document.getElementById('s_tireMi').value), tire_alert_km: parseFloat(document.getElementById('s_tireAlertKm').value), tire_alert_mi: parseFloat(document.getElementById('s_tireAlertMi').value)}; var r = await supabase.from('settings').update(newSettings).eq('id', 1); if(r.error){ alert('Error: '+r.error.message); return; } await loadData(); alert('✅ Configuración guardada.'); }
function renderAudit(){ if(!isAdmin()){ document.getElementById('main').innerHTML='<div class="card"><p>Acceso restringido.</p></div>'; return; } var main = document.getElementById('main'); main.innerHTML = '<div class="page-header"><div><h1>Auditoría</h1></div></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Entidad</th><th>Campo</th><th>Anterior</th><th>Nuevo</th></tr></thead><tbody>'+allAudit.slice(0,500).map(function(r){ return '<tr class="audit-row"><td>'+fmtDateTime(r.log_date)+'</td><td><strong>'+escapeHtml(r.user_email)+'</strong></td><td>'+escapeHtml(r.action)+'</td><td>'+escapeHtml(r.entity)+'</td><td>'+escapeHtml(r.field)+'</td><td><span class="old">'+escapeHtml(r.old_value)+'</span></td><td><span class="new">'+escapeHtml(r.new_value)+'</span></td></tr>'; }).join('')+'</tbody></table></div></div>'; }
function renderExport(){ var main = document.getElementById('main'); main.innerHTML = '<div class="page-header"><div><h1>Exportar datos</h1></div></div><div class="card"><h3>Selecciona qué exportar</h3><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn-primary" onclick="exportCSV(\'vehicles\')">📋 Vehículos</button><button class="btn-primary" onclick="exportCSV(\'mileage\')">📏 Kilometraje</button><button class="btn-primary" onclick="exportCSV(\'maintenance\')">🔧 Mantenimientos</button><button class="btn-primary" onclick="exportCSV(\'tires\')">🛞 Llantas</button><button class="btn-success" onclick="exportCSV(\'all\')">📦 Todo</button>'+(isAdmin()?'<button class="btn-warning" onclick="exportCSV(\'audit\')">🔍 Auditoría</button>':'')+'</div></div>'; }
function exportCSV(what){ var rows = []; var esc = function(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }; if(what==='vehicles' || what==='all'){ rows.push(['Equipo','Marca','Modelo','Año','Unidad','Km actual','Intervalo']); allVehicles.forEach(function(v){ rows.push([v.equipment_number,v.brand,v.model,v.year||'',v.unit,v.current_mileage,v.maintenance_interval]); }); } if(what==='mileage' || what==='all'){ rows.push([]); rows.push(['Fecha','Equipo','Km anterior','Km nuevo','Distancia','Usuario']); allMileage.forEach(function(m){ var v=allVehicles.find(function(x){return x.id===m.vehicle_id}); rows.push([m.log_date, v?.equipment_number||'?', m.previous_mileage, m.current_mileage, m.distance, m.user_email]); }); } if(what==='maintenance' || what==='all'){ rows.push([]); rows.push(['Fecha','Equipo','Km','Usuario']); allMaintenance.forEach(function(m){ var v=allVehicles.find(function(x){return x.id===m.vehicle_id}); rows.push([m.log_date, v?.equipment_number||'?', m.mileage, m.user_email]); }); } if(what==='tires' || what==='all'){ rows.push([]); rows.push(['Fecha','Equipo','Km','Usuario']); allTires.forEach(function(t){ var v=allVehicles.find(function(x){return x.id===t.vehicle_id}); rows.push([t.log_date, v?.equipment_number||'?', t.mileage, t.user_email]); }); } var csv = '\uFEFF' + rows.map(function(r){ return r.map(esc).join(','); }).join('\r\n'); var blob = new Blob([csv], {type:'text/csv;charset=utf-8'}); var url = URL.createObjectURL(blob); var a = document.createElement('a'); a.href = url; a.download = 'flota_'+what+'_'+today()+'.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); }
window.addEventListener('load', function(){ document.getElementById('loginEmail').focus(); });
